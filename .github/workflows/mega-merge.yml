# Authored by: cc (Claude Code) | 2026-03-30
# mega-merge.yml — Nightly integration of upstream openclaw PRs onto mega/latest.
# Each nightly run processes ~50-100 new PRs; a single final build validates the result.
# Manual trigger available via workflow_dispatch with optional overrides.

name: mega-merge

on:
  schedule:
    - cron: "0 2 * * 2" # 02:00 UTC every Tuesday
  workflow_dispatch:
    inputs:
      limit:
        description: "Max PRs to attempt (0 = unlimited)"
        required: false
        default: "0"
      skip_build:
        description: "Skip final build validation (true/false)"
        required: false
        default: "false"

# Prevent concurrent runs from fighting over mega/latest.
# New run waits for the current one to finish rather than cancelling it.
concurrency:
  group: mega-merge
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  merge:
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Checkout mega/latest
        uses: actions/checkout@v4
        with:
          ref: mega/latest
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lockb', 'package.json') }}
          restore-keys: ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Add upstream remote
        run: git remote add upstream https://github.com/openclaw/openclaw.git

      - name: Configure git identity
        run: |
          git config user.name "mega-merge[bot]"
          git config user.email "mega-merge[bot]@users.noreply.github.com"

      - name: Run mega-merge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          LIMIT="${{ github.event.inputs.limit || '0' }}"
          SKIP_BUILD="${{ github.event.inputs.skip_build || 'false' }}"

          ARGS=(--resume --create-release)

          if [ "$LIMIT" != "0" ]; then
            ARGS+=(--limit "$LIMIT")
          fi
          if [ "$SKIP_BUILD" = "true" ]; then
            ARGS+=(--skip-build)
          fi

          bun scripts/mega-merge.ts "${ARGS[@]}"

      - name: Push mega/latest
        if: success()
        run: git push origin mega/latest

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mega-merge-report-${{ github.run_id }}
          path: |
            docs/mega-merge-report.json
            docs/mega-merge-changelog.md
          if-no-files-found: ignore

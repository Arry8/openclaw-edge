# Authored by: cc (Claude Code) | 2026-03-30
# edge-merge.yml — Daily integration of upstream openclaw PRs onto mega/latest.
# Runs at 08:00 UTC. Timing is arbitrary — this branch is not rebased on upstream
# releases; it works through a fixed queue of ~6,500 open PRs independently.
# Builds every 10 merges (bundler + tsc); auto-reverts PRs that fail the build.
# Manual trigger available via workflow_dispatch with optional overrides.

name: edge-merge

on:
  schedule:
    - cron: "0 8 * * *" # 08:00 UTC daily
  workflow_dispatch:
    inputs:
      limit:
        description: "Max PRs to attempt (0 = unlimited)"
        required: false
        default: "0"
      skip_build:
        description: "Skip final build validation (true/false)"
        required: false
        default: "false"

# Prevent concurrent runs from fighting over mega/latest.
# New run waits for the current one to finish rather than cancelling it.
concurrency:
  group: edge-merge
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  merge:
    runs-on: ubuntu-24.04
    timeout-minutes: 350

    steps:
      - name: Checkout mega/latest
        uses: actions/checkout@v4
        with:
          ref: mega/latest
          fetch-depth: 0
          token: ${{ secrets.GH_PAT }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml', 'package.json') }}
          restore-keys: ${{ runner.os }}-pnpm-

      - name: Configure git identity
        run: |
          git config user.name "edge-merge[bot]"
          git config user.email "edge-merge[bot]@users.noreply.github.com"

      - name: Install dependencies
        run: |
          pnpm install --no-frozen-lockfile --ignore-scripts --config.allowNonAppliedPatches=true
          git add -A && git diff --cached --quiet || git commit --no-verify -m "chore(ci): regenerate lockfile after upstream changes"

      - name: Add upstream remote
        run: git remote add upstream https://github.com/openclaw/openclaw.git

      - name: Run edge-merge
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          LIMIT="${{ github.event.inputs.limit || '0' }}"
          SKIP_BUILD="${{ github.event.inputs.skip_build || 'false' }}"

          ARGS=(
            --resume
            --build-interval 10
            --auto-skip-on-build-failure
            --create-release
          )

          if [ "$LIMIT" != "0" ]; then
            ARGS+=(--limit "$LIMIT")
          fi
          if [ "$SKIP_BUILD" = "true" ]; then
            ARGS+=(--skip-build)
          fi

          bun edge-merge/scripts/edge-merge.ts "${ARGS[@]}"

      - name: Push mega/latest
        if: always()
        run: git push origin mega/latest --force

      - name: Disable upstream workflows
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow list --repo ${{ github.repository }} --all --json id,name,state \
            | jq -r '.[] | select(.state == "active") | select(.name != "edge-merge") | select(.name != "Dependabot Updates") | .id' \
            | while read -r id; do
                gh workflow disable --repo ${{ github.repository }} "$id" \
                  && echo "Disabled workflow $id" \
                  || echo "Warning: could not disable workflow $id"
              done

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: edge-merge-report-${{ github.run_id }}
          path: |
            edge-merge/docs/report.json
            edge-merge/docs/changelog.md
          if-no-files-found: ignore
